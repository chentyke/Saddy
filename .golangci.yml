# golangci-lint configuration
# Compatible with golangci-lint v1.x
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - vendor
    - build
    - dist
  
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
  
  max-issues-per-linter: 50
  max-same-issues: 3
  
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - goconst

    - linters:
        - staticcheck
      text: "SA9003:"

    - linters:
        - revive
      text: "type name will be used as cache.CacheItem"
    
    - linters:
        - revive
      text: "var-naming: avoid meaningless package names"
    
    - linters:
        - revive
      text: "exported: type name will be used as"
    
    - linters:
        - revive
      text: "stutters; consider calling this"
    
    - linters:
        - gosec
      text: "G304:"
    
    - linters:
        - gosec
      text: "G301:"

  exclude-use-default: false

linters:
  enable:
    - errcheck      # Checking for unchecked errors
    - govet         # Reports suspicious constructs
    - ineffassign   # Detects unused assignments
    - staticcheck   # Static analysis
    - unused        # Checks for unused constants, variables, functions and types
    - misspell      # Finds commonly misspelled English words
    - goconst       # Finds repeated strings that could be replaced by a constant
    - gocyclo       # Computes cyclomatic complexities
    - gosec         # Inspects source code for security problems
    - revive        # Fast, configurable, extensible, flexible linter
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Reports unused function parameters

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable:
      - shadow

  gocyclo:
    min-complexity: 16

  misspell:
    locale: US

  goconst:
    min-len: 3
    min-occurrences: 3

  gosec:
    excludes:
      - G404 # Weak random number generator
      - G304 # File inclusion via variable (we need dynamic file paths)
      - G301 # Directory permissions 0755 is acceptable for cache directories
  
  revive:
    rules:
      - name: var-naming
        disabled: true
      - name: exported
        disabled: true
