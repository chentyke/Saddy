# golangci-lint configuration
# Compatible with golangci-lint v2.x
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - build
    - dist
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"

linters:
  enable:
    - errcheck      # Checking for unchecked errors
    - govet         # Reports suspicious constructs
    - ineffassign   # Detects unused assignments
    - staticcheck   # Static analysis
    - unused        # Checks for unused constants, variables, functions and types
    - misspell      # Finds commonly misspelled English words
    - goconst       # Finds repeated strings that could be replaced by a constant
    - gocyclo       # Computes cyclomatic complexities
    - gosec         # Inspects source code for security problems
    - revive        # Fast, configurable, extensible, flexible linter
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Reports unused function parameters

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      - shadow

  gocyclo:
    min-complexity: 15

  misspell:
    locale: US

  goconst:
    min-len: 3
    min-occurrences: 3

  gosec:
    excludes:
      - G404 # Weak random number generator
      - G304 # File inclusion via variable

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - goconst

    - linters:
        - staticcheck
      text: "SA9003:"

    - linters:
        - revive
      text: "type name will be used as cache.CacheItem"

  exclude-use-default: false
